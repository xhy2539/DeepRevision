collection_name: agent
persist_directory: chroma_db
k: 8              # 增加召回数量
data_path: data
md5_hex_store: md5.text
allow_knowledge_file_type: ["txt", "pdf", "docx", "ppt", "pptx", "png", "jpg", "jpeg", "webp", "gif", "bmp"]

# ============== 分块配置 - 优化版 ==============
chunk_size: 1800      # 增大，保留更多上下文，减少知识碎片化
chunk_overlap: 300    # 增加重叠，保持上下文连贯
separators: [
  "\n\n\n",      # 大段落分隔
  "\n\n",        # 段落分隔
  "\n",          # 换行
  "。",          # 中文句子
  "！",          # 感叹句
  "？",          # 疑问句
  ". ",          # 英文句子
  "! ",          # 英文感叹
  "? ",          # 英文疑问
  ", ",          # 英文逗号
  " ",           # 空格
  ""             # 字符级
]

# ============== 混合检索配置 ==============
# BM25 + 向量 RRF 混合检索
bm25_weight: 0.4      # BM25 权重 (关键词匹配)
vector_weight: 0.6    # 向量权重 (语义匹配)
rrf_k: 30            # RRF 公式参数（降低30，重视高排名结果）

# 检索参数 - 扩大覆盖范围
retrieve_top_k: 20    # 混合检索召回数量
rerank_final_k: 12   # 最终返回数量
retrieve_fast_to_full_min_docs: 3   # fast 档命中不足时自动升级到 full 的阈值
retrieve_fast_to_full_min_sources: 2   # fast 档来源多样性不足时自动升级到 full 的阈值
retrieve_context_cache_ttl_seconds: 1200   # 检索上下文缓存 TTL（秒），20 分钟
retrieve_context_cache_max_entries: 1000   # 检索上下文缓存最大条目数（进程内）
hyde_enabled: true   # 是否启用 HyDE（低召回场景）
hyde_trigger_min_docs: 3   # 命中数低于该阈值时触发 HyDE
hyde_max_chars: 180   # HyDE 假设段落最大长度
comprehensive_retrieve_parallelism: 2   # 综合检索并发上限

# ============== 流式链路 V2（灰度） ==============
stream_v2_enabled: true   # 是否启用 stream_v2 主开关
stream_v2_rollout_percent: 100   # 按 session_id hash 命中灰度比例（0-100）
stream_v2_routes: ["rag", "chitchat"]   # 允许走 stream_v2 的路由
stream_v2_emit_sections: true   # 是否输出 reasoning/action/citation 分区事件
stream_v2_legacy_delta_mirror: true   # 是否镜像旧版 delta 事件，兼容旧前端

# MMR 多样性参数 (可选)
mmr_enabled: true    # 是否启用 MMR 多样性检索
mmr_lambda: 0.5       # 0=多样性, 1=相关性（降低以增加多样性）
